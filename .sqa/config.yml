config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/cessda/cessda.benchmark-report-generator:
      branch: main
      repo: https://github.com/cessda/cessda.benchmark-report-generator
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/cessda/cessda.benchmark-report-generator git:
        commands:
        - /usr/bin/env sh .sqa/script.cerulean_confident_roadrunner.sh
        container: qc.acc_aqua_exuberant_griffin
  QC.Doc:
    repos:
      github.com/cessda/cessda.benchmark-report-generator find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.powder_delighted_panda.sh
        container: qc.doc_ice_mischievous_unicorn
      github.com/cessda/cessda.benchmark-report-generator git:
        commands:
        - /usr/bin/env sh .sqa/script.sunset_aware_leopard.sh
        container: qc.doc_ecru_impulsive_komodo
      github.com/cessda/cessda.benchmark-report-generator markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.iris_energetic_hippopotamus.sh
        container: qc.doc_butter_quirky_osprey
  QC.Lic:
    repos:
      github.com/cessda/cessda.benchmark-report-generator licensee:
        commands:
        - /usr/bin/env sh .sqa/script.rose_diligent_roc.sh
        container: qc.lic_sunset_spirited_fox
  QC.Met:
    repos:
      github.com/cessda/cessda.benchmark-report-generator cff-converter-python:
        commands:
        - /usr/bin/env sh .sqa/script.cinnamon_timid_porpoise.sh
        container: qc.met_carmine_inventive_manta
  QC.Ver:
    repos:
      github.com/cessda/cessda.benchmark-report-generator get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.aqua_energetic_wasp.sh
        container: qc.ver_blush_practical_clownfish
timeout: 5400
